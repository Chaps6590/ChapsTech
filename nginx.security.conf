# Incluir dentro del bloque server { } de chapstech.cloud (Nginx):
#   include /ruta/al/proyecto/nginx.security.conf;
# `always` hace que las cabeceras salgan también en respuestas 404/5xx.

server_tokens off;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Nota: si un location define sus propios add_header, Nginx NO hereda estos;
# repetir la inclusión dentro de ese location.
